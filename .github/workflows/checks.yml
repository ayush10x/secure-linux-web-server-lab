name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Bash syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Lint Bash scripts
        run: shellcheck scripts/*.sh
      - name: Offline script regression fixtures (not VM acceptance tests)
        run: python3 -m unittest discover -s tests -v
      - name: Verify required project files
        run: |
          test -s README.md
          test -s site/index.html
          test -s config/lab-site.nginx
          test -s docs/test-plan.md
          test -s docs/project-report.md
          test -s docs/verification-evidence.md
          test -s config/00-lab-hardening.conf
          test -s output/pdf/secure-linux-web-server-report.pdf
