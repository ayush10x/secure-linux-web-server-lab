# Install as /etc/ssh/sshd_config.d/00-lab-hardening.conf
# OpenSSH uses the first value found; this must precede 50-cloud-init.conf.
# Replace labadmin in AllowUsers with your chosen administrator account.
# Confirm that its key login and sudo work before enabling this file.
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AllowUsers labadmin
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
PermitUserEnvironment no
MaxAuthTries 3
MaxSessions 2
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30
