# Install as /etc/ssh/sshd_config.d/00-lab-hardening.conf
# OpenSSH uses the first value found; this must precede 50-cloud-init.conf.
# Confirm that ayush key login and sudo work before enabling this file.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AllowUsers ayush
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
