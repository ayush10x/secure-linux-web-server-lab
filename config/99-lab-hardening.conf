# Install as /etc/ssh/sshd_config.d/99-lab-hardening.conf
# Confirm that ayush key login and sudo work before enabling this file.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AllowUsers ayush
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
